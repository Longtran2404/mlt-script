name: Transcribe Facebook Reel

on:
  pull_request:
    paths:
      - 'transcripts/request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U yt-dlp faster-whisper requests

      - name: Read request URL
        id: req
        shell: bash
        run: |
          URL=$(tail -n 1 transcripts/request.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Requested: $URL"

      - name: Download Facebook Reel
        shell: bash
        env:
          URL: ${{ steps.req.outputs.url }}
        run: |
          set -o pipefail
          mkdir -p output
          python - <<'PY' | tee output/resolve.txt
          import os, requests
          url=os.environ['URL']
          r=requests.get(url, allow_redirects=True, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
          print(r.url)
          PY
          FINAL_URL=$(tail -n 1 output/resolve.txt)
          echo "Resolved URL: $FINAL_URL" | tee output/download.log
          if ! yt-dlp --no-playlist --restrict-filenames --user-agent 'Mozilla/5.0' -o 'output/video.%(ext)s' "$FINAL_URL" 2>&1 | tee -a output/download.log; then
            echo 'First attempt failed; retrying original share URL' | tee -a output/download.log
            yt-dlp --no-playlist --restrict-filenames --user-agent 'Mozilla/5.0' -o 'output/video.%(ext)s' "$URL" 2>&1 | tee -a output/download.log
          fi
          VIDEO=$(find output -maxdepth 1 -type f -name 'video.*' | head -n 1)
          test -n "$VIDEO"
          ffmpeg -y -i "$VIDEO" -vn -ac 1 -ar 16000 output/audio.wav

      - name: Transcribe with Whisper
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe('output/audio.wav', vad_filter=True, beam_size=5)
          plain=[]
          timed=[]
          for s in segments:
              t=s.text.strip()
              if not t:
                  continue
              plain.append(t)
              timed.append(f'[{s.start:07.2f} - {s.end:07.2f}] {t}')
          Path('output/transcript.txt').write_text('\n'.join(plain), encoding='utf-8')
          Path('output/transcript_timestamps.txt').write_text('\n'.join(timed), encoding='utf-8')
          Path('output/language.txt').write_text(f'language={info.language}\nprobability={info.language_probability}\n', encoding='utf-8')
          PY

      - name: Upload transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-transcript
          path: |
            output/transcript.txt
            output/transcript_timestamps.txt
            output/language.txt
            output/download.log
            output/resolve.txt
          if-no-files-found: warn
          retention-days: 1
