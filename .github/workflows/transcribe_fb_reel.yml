name: Transcribe Facebook Reel

on:
  pull_request:
    paths:
      - 'transcripts/request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -U 'yt-dlp[default,curl-cffi]' faster-whisper requests

      - name: Read request URL
        id: req
        shell: bash
        run: |
          URL=$(tail -n 1 transcripts/request.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Requested: $URL"

      - name: Download Facebook Reel
        shell: bash
        env:
          URL: ${{ steps.req.outputs.url }}
        run: |
          set -o pipefail
          mkdir -p output
          python - <<'PY' > output/candidates.txt
          import os, requests, urllib.parse, re
          url=os.environ['URL']
          r=requests.get(url, allow_redirects=True, timeout=30, headers={'User-Agent':'Mozilla/5.0'})
          print(url)
          print(r.url)
          q=urllib.parse.parse_qs(urllib.parse.urlparse(r.url).query)
          nxt=q.get('next',[''])[0]
          if nxt:
              print(nxt)
              nq=urllib.parse.parse_qs(urllib.parse.urlparse(nxt).query)
              vid=nq.get('story_fbid',[''])[0]
              page=nq.get('id',[''])[0]
              if vid:
                  print(f'https://www.facebook.com/reel/{vid}/')
                  print(f'https://www.facebook.com/watch/?v={vid}')
                  if page:
                      print(f'https://www.facebook.com/{page}/videos/{vid}/')
          PY
          echo 'Candidate URLs:' | tee output/download.log
          cat output/candidates.txt | tee -a output/download.log
          yt-dlp --list-impersonate-targets 2>&1 | tee -a output/download.log || true
          SUCCESS=0
          while IFS= read -r CANDIDATE; do
            [ -z "$CANDIDATE" ] && continue
            echo "Trying: $CANDIDATE" | tee -a output/download.log
            if yt-dlp --impersonate chrome --no-playlist --restrict-filenames -o 'output/video.%(ext)s' "$CANDIDATE" 2>&1 | tee -a output/download.log; then
              SUCCESS=1
              break
            fi
          done < output/candidates.txt
          if [ "$SUCCESS" -ne 1 ]; then
            echo 'All candidate downloads failed' | tee -a output/download.log
            exit 1
          fi
          VIDEO=$(find output -maxdepth 1 -type f -name 'video.*' | head -n 1)
          test -n "$VIDEO"
          ffmpeg -y -i "$VIDEO" -vn -ac 1 -ar 16000 output/audio.wav

      - name: Transcribe with Whisper
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          model = WhisperModel('small', device='cpu', compute_type='int8')
          segments, info = model.transcribe('output/audio.wav', vad_filter=True, beam_size=5)
          plain=[]
          timed=[]
          for s in segments:
              t=s.text.strip()
              if not t:
                  continue
              plain.append(t)
              timed.append(f'[{s.start:07.2f} - {s.end:07.2f}] {t}')
          Path('output/transcript.txt').write_text('\n'.join(plain), encoding='utf-8')
          Path('output/transcript_timestamps.txt').write_text('\n'.join(timed), encoding='utf-8')
          Path('output/language.txt').write_text(f'language={info.language}\nprobability={info.language_probability}\n', encoding='utf-8')
          PY

      - name: Upload transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-transcript
          path: |
            output/transcript.txt
            output/transcript_timestamps.txt
            output/language.txt
            output/download.log
            output/candidates.txt
          if-no-files-found: warn
          retention-days: 1
