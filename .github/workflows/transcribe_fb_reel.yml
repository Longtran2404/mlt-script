name: Transcribe Facebook Reel

on:
  pull_request:
    paths:
      - 'transcripts/request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade pip
          pip install -U 'yt-dlp[default,curl-cffi]' faster-whisper requests playwright

      - name: Read request URL
        id: req
        shell: bash
        run: |
          URL=$(tail -n 1 transcripts/request.txt)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Requested: $URL"

      - name: Resolve Facebook IDs
        shell: bash
        env:
          URL: ${{ steps.req.outputs.url }}
        run: |
          mkdir -p output
          python - <<'PY'
          import os, requests, urllib.parse, pathlib, re
          url=os.environ['URL']
          r=requests.get(url,allow_redirects=True,timeout=30,headers={'User-Agent':'Mozilla/5.0'})
          final_url=r.url
          vid=''; page=''; nxt=''
          for candidate in (final_url, url):
              m=re.search(r'/reel/(\d+)', candidate)
              if m:
                  vid=m.group(1)
                  break
          q=urllib.parse.parse_qs(urllib.parse.urlparse(final_url).query)
          nxt=q.get('next',[''])[0]
          if nxt:
              nq=urllib.parse.parse_qs(urllib.parse.urlparse(nxt).query)
              if not vid:
                  vid=nq.get('story_fbid',[''])[0]
              page=nq.get('id',[''])[0]
          else:
              q2=urllib.parse.parse_qs(urllib.parse.urlparse(final_url).query)
              if not vid:
                  vid=q2.get('story_fbid',[''])[0] or q2.get('v',[''])[0]
              page=q2.get('id',[''])[0]
          pathlib.Path('output/video_id.txt').write_text(vid,encoding='utf-8')
          pathlib.Path('output/page_id.txt').write_text(page,encoding='utf-8')
          pathlib.Path('output/resolved.txt').write_text('\n'.join([url,final_url,nxt,vid,page]),encoding='utf-8')
          print('final_url=',final_url)
          print('video_id=',vid)
          print('page_id=',page)
          PY

      - name: Capture public embed media with Chrome
        id: embed
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse, pathlib, requests, re, base64
          from playwright.sync_api import sync_playwright

          vid=pathlib.Path('output/video_id.txt').read_text().strip()
          page_id=pathlib.Path('output/page_id.txt').read_text().strip()
          if not vid: raise SystemExit(2)
          sources=[
            f'https://www.facebook.com/reel/{vid}/',
            f'https://www.facebook.com/watch/?v={vid}',
            f'https://www.facebook.com/{page_id}/videos/{vid}/' if page_id else '',
            f'https://www.facebook.com/story.php?story_fbid={vid}&id={page_id}' if page_id else '',
          ]
          sources=[s for s in sources if s]
          media=[]; seen=set()

          def add_media(url,ctype='',rtype=''):
              if not url or url in seen: return
              lu=url.lower(); lc=(ctype or '').lower()
              is_media=(rtype=='media' or lc.startswith('video/') or lc.startswith('audio/') or '.mp4' in lu or '.m3u8' in lu or '.mpd' in lu)
              if 'static.xx.fbcdn.net' in lu or not is_media: return
              seen.add(url); media.append((url,ctype,rtype))

          def vencode_tag(url):
              try:
                  q=urllib.parse.parse_qs(urllib.parse.urlsplit(url).query)
                  efg=q.get('efg',[''])[0]
                  if not efg: return ''
                  raw=base64.b64decode(efg + '='*(-len(efg)%4))
                  return json.loads(raw).get('vencode_tag','')
              except Exception:
                  return ''

          chrome='/usr/bin/google-chrome'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=chrome,args=['--no-sandbox','--disable-dev-shm-usage','--autoplay-policy=no-user-gesture-required'])
              context=browser.new_context(user_agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36',locale='en-US')
              page=context.new_page()
              def on_response(resp):
                  try: add_media(resp.url,resp.headers.get('content-type',''),resp.request.resource_type)
                  except Exception: pass
              page.on('response',on_response)
              pages=[]
              for src in sources:
                  embed='https://www.facebook.com/plugins/video.php?href='+urllib.parse.quote(src,safe='')+'&show_text=false&autoplay=true&width=560'
                  print('OPEN',embed)
                  try:
                      page.goto(embed,wait_until='domcontentloaded',timeout=45000)
                      page.wait_for_timeout(2500)
                      try: page.locator('video').evaluate_all("els=>els.forEach(v=>{v.muted=true;v.autoplay=true;v.play().catch(()=>{})})")
                      except Exception: pass
                      page.wait_for_timeout(6000)
                      vals=page.locator('video').evaluate_all("els=>els.map(v=>({src:v.src,currentSrc:v.currentSrc,ready:v.readyState}))")
                      print('VIDEO_ELEMENTS',json.dumps(vals)[:3000])
                      for v in vals: add_media(v.get('currentSrc') or v.get('src') or '','video/mp4','media')
                      pages.append(page.content())
                  except Exception as e: print('embed error',e)
              pathlib.Path('output/embed_browser.html').write_text('\n<!--PAGE-->\n'.join(pages),encoding='utf-8')
              browser.close()

          pathlib.Path('output/media_candidates.txt').write_text('\n'.join(f'{c}\t{r}\t{u}' for u,c,r in media),encoding='utf-8')
          print('MEDIA_COUNT',len(media))
          if not media: raise SystemExit(3)

          sess=requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/145 Safari/537.36','Referer':'https://www.facebook.com/'})

          # Prefer the dedicated HE-AAC audio representation. Facebook's browser player
          # requests it as DASH byte ranges; removing bytestart/byteend asks the CDN for
          # the complete underlying audio MP4 instead of one fragment.
          audio_urls=[]
          for u,c,r in media:
              if 'audio' in vencode_tag(u).lower() and not u.startswith('blob:'):
                  full=re.sub(r'([&?])bytestart=\d+&byteend=\d+','',u)
                  if full not in audio_urls:
                      audio_urls.append(full)
          print('AUDIO_BASE_CANDIDATES',len(audio_urls))
          for i,u in enumerate(audio_urls):
              try:
                  rr=sess.get(u,stream=True,timeout=90)
                  ct=rr.headers.get('content-type','').lower()
                  out=pathlib.Path(f'output/audio_base_{i}.mp4')
                  with out.open('wb') as f:
                      for chunk in rr.iter_content(1024*1024):
                          if chunk: f.write(chunk)
                  size=out.stat().st_size
                  print('AUDIO_BASE_DOWNLOAD',i,rr.status_code,ct,size,rr.headers.get('content-range',''))
                  if rr.status_code < 400 and size > 100000:
                      pathlib.Path('output/audio_source.mp4').write_bytes(out.read_bytes())
                      pathlib.Path('output/audio_source_url.txt').write_text(u,encoding='utf-8')
                      print('AUDIO_FULL_DOWNLOAD_SUCCESS',u)
                      raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print('audio base download error',i,e)

          # Generic media fallback.
          for i,(u,c,r) in enumerate(media):
              if u.startswith('blob:'): continue
              if '.m3u8' in u.lower() or '.mpd' in u.lower():
                  pathlib.Path('output/stream_url.txt').write_text(u,encoding='utf-8')
                  print('STREAM_URL_SUCCESS',u)
                  raise SystemExit(0)
              try:
                  rr=sess.get(u,stream=True,timeout=60)
                  ct=rr.headers.get('content-type','').lower()
                  out=pathlib.Path(f'output/candidate_{i}.bin')
                  with out.open('wb') as f:
                      for chunk in rr.iter_content(1024*1024):
                          if chunk: f.write(chunk)
                  size=out.stat().st_size
                  print('DOWNLOAD',i,rr.status_code,ct,size)
                  if rr.status_code<400 and size>100000 and (ct.startswith('video/') or ct.startswith('audio/') or '.mp4' in u.lower()):
                      pathlib.Path('output/video.mp4').write_bytes(out.read_bytes())
                      print('MEDIA_DOWNLOAD_SUCCESS',u)
                      raise SystemExit(0)
              except SystemExit: raise
              except Exception as e: print('download error',i,e)
          raise SystemExit(4)
          PY

      - name: Fallback to yt-dlp
        if: steps.embed.outcome != 'success'
        shell: bash
        run: |
          VID=$(cat output/video_id.txt); PAGE=$(cat output/page_id.txt); SUCCESS=0
          CANDIDATES=("https://www.facebook.com/reel/$VID/" "https://www.facebook.com/watch/?v=$VID")
          if [ -n "$PAGE" ]; then CANDIDATES+=("https://www.facebook.com/$PAGE/videos/$VID/"); fi
          for CANDIDATE in "${CANDIDATES[@]}"; do
            echo "Trying yt-dlp: $CANDIDATE"
            if yt-dlp --impersonate chrome --no-playlist --restrict-filenames -o 'output/video.%(ext)s' "$CANDIDATE"; then SUCCESS=1; break; fi
          done
          test "$SUCCESS" -eq 1

      - name: Extract audio
        shell: bash
        run: |
          if [ -s output/audio_source.mp4 ]; then
            echo 'Using dedicated Facebook audio track'
            ffmpeg -y -i output/audio_source.mp4 -vn -ac 1 -ar 16000 output/audio.wav
          elif [ -s output/stream_url.txt ]; then
            STREAM=$(cat output/stream_url.txt)
            ffmpeg -y -headers $'Referer: https://www.facebook.com/\r\nUser-Agent: Mozilla/5.0\r\n' -i "$STREAM" -vn -ac 1 -ar 16000 output/audio.wav
          else
            VIDEO=$(find output -maxdepth 1 -type f \( -name 'video.mp4' -o -name 'video.webm' -o -name 'video.mkv' \) | head -n 1)
            test -n "$VIDEO"
            ffmpeg -y -i "$VIDEO" -vn -ac 1 -ar 16000 output/audio.wav
          fi

      - name: Transcribe with Whisper
        run: |
          python - <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          model=WhisperModel('small',device='cpu',compute_type='int8')
          segments,info=model.transcribe('output/audio.wav',vad_filter=True,beam_size=5)
          plain=[]; timed=[]
          for s in segments:
              t=s.text.strip()
              if not t: continue
              plain.append(t); timed.append(f'[{s.start:07.2f} - {s.end:07.2f}] {t}')
          Path('output/transcript.txt').write_text('\n'.join(plain),encoding='utf-8')
          Path('output/transcript_timestamps.txt').write_text('\n'.join(timed),encoding='utf-8')
          Path('output/language.txt').write_text(f'language={info.language}\nprobability={info.language_probability}\n',encoding='utf-8')
          print('===TRANSCRIPT_TS_START===')
          print('\n'.join(timed))
          print('===TRANSCRIPT_TS_END===')
          PY

      - name: Upload transcript artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-reel-transcript
          path: |
            output/transcript.txt
            output/transcript_timestamps.txt
            output/language.txt
            output/resolved.txt
            output/media_candidates.txt
            output/embed_browser.html
            output/audio_source_url.txt
            output/stream_url.txt
          if-no-files-found: warn
          retention-days: 1
